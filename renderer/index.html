<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.cloudflare.steamstatic.com; connect-src 'self'">
<title>Sveqzz Optimizer</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="logo.svg" alt="" width="34" height="34"><div><b>SVEQZZ</b><small>OPTIMIZER</small></div></div>
    <nav id="nav"></nav>
    <div class="side-foot"><span id="adminBadge" class="pill"></span><small>v2.0</small></div>
  </aside>
  <main class="main" id="main">
    <header class="top">
      <div class="crumbs"><span>SVEQZZ</span><i>/</i><b id="crumb">Inicio</b></div>
      <div class="chips">
        <span class="chip" id="chipMode" title="Modo activo"></span>
        <button class="chip btn-chip" id="chipOverlay" title="Mostrar u ocultar el overlay (Ctrl+Mayús+O)"></button>
        <button class="chip btn-chip" id="chipSearch" title="Buscar o ejecutar (Ctrl+K)"><span>Buscar o ejecutar…</span><kbd>Ctrl K</kbd></button>
      </div>
    </header>
    <div id="banner" class="banner" hidden></div>
    <div id="page" class="page"></div>
  </main>
  <aside class="live" id="live">
    <h4>ESTADO EN VIVO</h4>
    <div class="metric"><span>PROCESADOR</span><b id="mCpu">–</b><canvas id="cCpu" width="200" height="40"></canvas></div>
    <div class="metric"><span>MEMORIA</span><b id="mRam">–</b><canvas id="cRam" width="200" height="40"></canvas></div>
    <div class="metric" id="gpuBox"><span>GRÁFICOS</span><b id="mGpu">–</b><canvas id="cGpu" width="200" height="40"></canvas></div>
    <div class="metric" id="tempBox" hidden><span>TEMPERATURA GPU</span><b id="mTemp" class="mid">–</b></div>
    <div class="metric"><span>PING · 1.1.1.1</span><b id="mPing" class="mid">–</b></div>
    <div class="metric"><span>JUEGO</span><b id="mGame" class="mid">Ninguno</b></div>
  </aside>
</div>
<div id="modal" class="modal" hidden></div>
<div id="cmdk" class="modal" hidden></div>
<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
